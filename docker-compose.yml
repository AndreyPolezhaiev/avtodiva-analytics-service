services:
  avtodiva-analytics-service:
    restart: unless-stopped
    container_name: avtodiva-analytics-service
    image: ghcr.io/andreypolezhaiev/avtodiva-analytics-service:latest
    build: .
    env_file:
      - .env.dev
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"
    networks:
      - avtodiva-net
    environment:
      - SPRING_PROFILES_ACTIVE=dev

# kafka is started by avtodiva-advanced docker-compose in the same network
networks:
  avtodiva-net:
    external: true
    name: avtodiva-network
