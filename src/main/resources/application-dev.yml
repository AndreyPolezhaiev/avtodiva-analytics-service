spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        generate_statistics: true

# must be the same secret as in avtodiva-advanced, tokens are issued there
jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    org:
      hibernate:
        SQL: OFF
        stat: OFF
      springframework:
        security: DEBUG
        web:
          cors: DEBUG
