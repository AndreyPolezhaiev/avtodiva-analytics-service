server:
  port: ${SPRING_DOCKER_PORT:8081}

spring:
  profiles:
    active: dev
  application:
    name: avtodiva-analytics-service
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 300000
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:avtodiva-analytics-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # producer sends no type headers, so the target type is fixed here
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.polezhaiev.analytics.dto.ScheduleSlotEventDto

app:
  kafka:
    topics:
      analytics-slots: ${KAFKA_ANALYTICS_SLOTS_TOPIC}
